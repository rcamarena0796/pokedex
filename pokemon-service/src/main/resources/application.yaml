server:
  port: 8082

spring:
  application:
    name: pokemon-service
  # Default profile: PostgreSQL (start it with `docker compose up postgres`).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokemondb}
    username: ${DB_USERNAME:pokedex}
    password: ${DB_PASSWORD:pokedex}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # Reject payloads with unknown fields (400). PokeAPI DTOs opt out with @JsonIgnoreProperties.
      fail-on-unknown-properties: true
  cache:
    type: caffeine
    cache-names: pokeapi-list, pokeapi-pokemon, pokeapi-species, pokeapi-evolution
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=12h

pokeapi:
  base-url: https://pokeapi.co/api/v2
  connect-timeout: 3s
  read-timeout: 10s

security:
  jwt:
    # Must match auth-service. Override with JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:change-me-this-is-a-dev-only-secret-of-at-least-32-bytes}
    issuer: https://auth.pokedex.local

springdoc:
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info

---
spring:
  config:
    activate:
      on-profile: h2
  # In-memory H2 (PostgreSQL compatibility mode): runs without Docker and is used by the integration tests.
  datasource:
    url: jdbc:h2:mem:pokemondb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
