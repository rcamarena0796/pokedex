server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API gateway: /api/<prefix> is forwarded to the service that owns it, with /api stripped.
    # Upstreams are variables resolved through Docker's DNS on each request (cached 10s), so nginx
    # keeps working when a service container is recreated and gets a new IP.
    # AUTH_SERVICE_URL / POKEMON_SERVICE_URL are filled in at startup (nginx image templates).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_service    ${AUTH_SERVICE_URL};
    set $pokemon_service ${POKEMON_SERVICE_URL};

    location /api/auth    { proxy_pass $auth_service;    include /etc/nginx/proxy_common.conf; }
    location /api/users   { proxy_pass $auth_service;    include /etc/nginx/proxy_common.conf; }
    location /api/catalog { proxy_pass $pokemon_service; include /etc/nginx/proxy_common.conf; }
    location /api/pokemon { proxy_pass $pokemon_service; include /etc/nginx/proxy_common.conf; }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
